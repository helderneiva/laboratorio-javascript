    <defs>
        <linearGradient id="fundo" x2="1" y2="1">
            <stop stop-color="#e1edf5"/>
            <stop offset="1" stop-color="#aec8df"/>
        </linearGradient>
        <linearGradient id="cartao" x2="1" y2="1">
            <stop stop-color="#123b40"/>
            <stop offset="1" stop-color="#24595a"/>
        </linearGradient>
        <clipPath id="recorte">
            <rect x="678" y="172" width="444" height="282" rx="26"/>
